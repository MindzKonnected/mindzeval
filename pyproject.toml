[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mindzeval"
dynamic = ["version"]
description = "Evaluation framework for SQL agents: result-based accuracy, behaviour scoring, multi-turn and golden-answer validation."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "MindzKonnected" }]
keywords = ["llm", "evaluation", "text-to-sql", "sql", "agents", "testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
# A library declares compatible ranges rather than exact pins, so it installs
# alongside the user's own agent stack. sqlglot is capped at the major version
# we test against because its expression classes change between majors.
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "PyYAML>=6.0,<7",
    "SQLAlchemy>=2.0,<3",
    "sqlglot>=30,<31",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.1,<4",
    "psycopg2-binary>=2.9,<3",
]
# Development tools are pinned exactly so every contributor and CI run uses the
# same versions.
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
    "mypy==2.4.0",
    "types-PyYAML==6.0.12.20260906",
]

[project.scripts]
mindzeval = "mindzeval.cli:main"

[project.urls]
Homepage = "https://github.com/MindzKonnected/mindzeval"
Documentation = "https://github.com/MindzKonnected/mindzeval#readme"
Repository = "https://github.com/MindzKonnected/mindzeval"
Issues = "https://github.com/MindzKonnected/mindzeval/issues"
Changelog = "https://github.com/MindzKonnected/mindzeval/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/mindzeval/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mindzeval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Line width is enforced by `ruff format`; long string literals it can't wrap are allowed.
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
packages = ["mindzeval"]
mypy_path = "src"
strict = true
plugins = ["pydantic.mypy"]
