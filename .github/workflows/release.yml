name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  check:
    name: Lint, type check and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint and format check
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Type check
        run: mypy

      - name: Run test suite
        run: pytest

      - name: Verify release tag matches package version
        run: |
          TAG="${{ github.ref_name }}"
          PKG_VERSION=$(python -c "import pathlib; d = {}; exec(pathlib.Path('src/mindzeval/_version.py').read_text(), d); print(d['__version__'])")
          if [ "$TAG" != "v${PKG_VERSION}" ]; then
            echo "::error::Release tag '$TAG' does not match package version 'v${PKG_VERSION}' in src/mindzeval/_version.py"
            exit 1
          fi
          echo "Verified release tag '$TAG' matches package version '$PKG_VERSION'"

  pypi-publish:
    name: Build and publish to PyPI
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mindzeval
    permissions:
      id-token: write  # Mandatory for PyPI Trusted Publishing (OIDC)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
