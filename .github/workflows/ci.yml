name: CI

on:
  push:
    branches: [development, main, production]
  pull_request:
    branches: [development, main, production]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest

  postgres:
    name: Test against Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mindzeval
          POSTGRES_PASSWORD: mindzeval
          POSTGRES_DB: mindzeval
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mindzeval"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MINDZEVAL_TEST_POSTGRES_URL: postgresql://mindzeval:mindzeval@localhost:5432/mindzeval
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,postgres]"
      - run: pytest tests/test_db.py -v
